# Compila el sistema con el SDK de .NET 8, el mismo que se instala en el servidor.
# En la PC se usa un SDK más nuevo, que acepta cosas que el de .NET 8 rechaza (sobre todo en las vistas Razor):
# así se ve el error aquí y no a mitad de un despliegue.
name: Compilar con .NET 8

on:
  push:
    branches: [main, despliegue]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Aquí se trabaja sobre una copia nueva del repositorio, igual que en el servidor: si una vista carga
      # un archivo que no está en Git (por ejemplo algo de wwwroot/lib ignorado), el sistema se vería roto
      # y ni la compilación ni las pruebas lo notarían.
      - name: Revisar que existan los archivos que cargan las vistas
        run: |
          faltan=0
          referencias=$( (grep -rhoE '~/[A-Za-z0-9_./-]+\.(css|js|webp|png|jpg|jpeg|svg|ico|woff2?)' Views || true; \
                          grep -rhoE "url\(['\"]?/[A-Za-z0-9_./-]+\.(webp|png|jpg|jpeg|svg)" Views | sed -E "s#url\(['\"]?/#~/#" || true) | sort -u)
          for r in $referencias; do
            archivo="wwwroot/${r#\~/}"
            if [ -f "$archivo" ]; then echo "ok    $archivo"; else echo "::error::Falta $archivo (lo carga una vista y no está en el repositorio)"; faltan=1; fi
          done
          exit $faltan

      - name: Usar el SDK 8 aunque el equipo tenga otros más nuevos
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json

      - name: Publicar (Release)
        run: |
          dotnet --version
          dotnet publish GestionAlmacen_Golocentro.csproj -c Release -o publish --nologo

      - name: Pruebas automatizadas (xUnit)
        run: >
          dotnet test GestionAlmacen_Golocentro.Tests/GestionAlmacen_Golocentro.Tests.csproj
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=resultados.trx"
          --results-directory resultados

      - name: Guardar el resultado de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: resultados/*.trx

      - name: Revisar sintaxis de los scripts del servidor
        run: for f in deploy/*.sh; do bash -n "$f"; done

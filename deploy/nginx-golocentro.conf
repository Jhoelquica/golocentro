# Nginx como proxy inverso hacia Kestrel (127.0.0.1:5050)
# Copiar a: /etc/nginx/sites-available/golocentro
# Reemplazar tudominio.com por el dominio real. Certbot agregará el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # Fotos de perfil (2 MB) y evidencias (5 MB cada una, pueden ir varias):
    # Nginx solo permite 1 MB por defecto. 30M coincide con el límite de Kestrel.
    client_max_body_size 30M;

    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
